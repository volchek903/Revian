services:
  revian-bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: revian-bot
    restart: unless-stopped
    env_file:
      - .env
    environment:
      APP_TZ: Europe/Moscow
      SQLITE_DB_NAME: storage/revian.sqlite3
      LOG_FILE: logs/bot_logs.log
    volumes:
      - revian_storage:/app/storage
      - revian_logs:/app/logs
    command: ["python", "main.py"]

volumes:
  revian_storage:
  revian_logs:
